# ═══════════════════════════════════════════════════════════════════
# wrangler.toml — Infrastructure-as-Code for the elfarida-ice Pages project
# Purpose: make the project reproducible (bindings + build output) so the
#          D1 binding is not dashboard-only. Cloudflare Pages reads this
#          during both CLI deploys and GitHub-integration builds.
#
# Deploy (from THIS directory):  npm run deploy
#   That builds dist/ first. Deploying without building publishes a stale or
#   missing site. The functions/ folder stays HERE, at the project root — Pages
#   compiles it into the Functions bundle and never serves it as an asset, so it
#   is not copied into dist/. Always confirm the output shows "Uploading
#   Functions bundle" — otherwise /api/quote and /admin/leads return 405.
#
# The Git-integration build runs the dashboard's build command (`npm run build`)
# and publishes the directory named below. Those two must agree: a build that
# writes dist/ while this says "." republishes the whole repository.
# ═══════════════════════════════════════════════════════════════════

name = "elfarida-ice"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-16"

# Durable storage for quote/contact leads and runtime settings
# (admin credentials, Resend key, sender, recipients).
[[d1_databases]]
binding = "DB"
database_name = "elfarida-leads"
database_id = "0637575c-303e-4150-9810-e96ea462ad49"
